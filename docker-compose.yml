services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: commandcenter-web
    ports:
      - "3000:80"
    environment:
      AUGMENTOR_URL: /augmentor
      ROBOT_API_URL: ${ROBOT_API_URL:-http://host.docker.internal:5002}
      GESTURE_API_URL: ${GESTURE_API_URL:-http://host.docker.internal:7001}
      SIM_SOCKET_URL: ${SIM_SOCKET_URL:-http://host.docker.internal:5001}
    depends_on:
      - augmentor
    extra_hosts:
      - "host.docker.internal:host-gateway"

  augmentor:
    build:
      context: .
      dockerfile: services/augmentor/Dockerfile
    container_name: commandcenter-augmentor
    ports:
      - "5000:5000"
    volumes:
      - augmentor_uploads:/app/uploads
      - augmentor_processed:/app/processed

  hilbert-api:
    build:
      context: .
      dockerfile: docker/hilbert.Dockerfile
    container_name: commandcenter-hilbert
    ports:
      - "5055:5000"
    profiles: ["tools"]

volumes:
  augmentor_uploads:
  augmentor_processed:
